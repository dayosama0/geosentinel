e8" height="41" stroke="none" width="615" x="55" y="596" /><text fill="#18334D" font-family="DejaVu Sans,Arial" font-size="17" font-weight="bold" text-anchor="start" x="61" y="626">ASYNC / OFFLINE PROCESSING  —  Python + PyTorch + Rasterio</text><rect fill="#f1effa" height="42" stroke="none" width="622" x="55" y="867" /><text fill="#18334D" font-family="DejaVu Sans,Arial" font-size="17" font-weight="bold" text-anchor="start" x="61" y="897">PERSISTENCE  —  PostGIS and protected artifacts</text><text fill="#607589" font-family="DejaVu Sans,Arial" font-size="14" font-weight="normal" text-anchor="start" x="55" y="1091">External interfaces: licensed satellite GeoTIFF imports and basemap tiles; third-party imagery is not part of the system.</text><text fill="#607589" font-family="DejaVu Sans,Arial" font-size="14" font-weight="normal" text-anchor="start" x="55" y="1120">Safety: observation provenance is retained; operator reviews model promotion; old imagery cannot trigger a recurrence alert by upload date alone.</text></svg>