<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="800px" version="1.1" viewBox="0 0 1500 800" width="1500px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 1,1 L 9,5 L 1,9 Z" fill="#648296" /></marker></defs><rect fill="white" height="800" width="1500" x="0" y="0" /><text fill="#18334D" font-family="DejaVu Sans,Arial" font-size="26" font-weight="bold" x="55" y="48">SYSTEM CONTEXT DIAGRAM</text><text fill="#607589" font-family="DejaVu Sans,Arial" font-size="14" x="55" y="75">External actors and data providers vs. one prototype system boundary</text><rect fill="#e6f6f1" height="368" rx="22" ry="22" stroke="#54ac96" stroke-width="2.4" width="524" x="488" y="213" /><text fill="#18334D" font-family="DejaVu Sans,Arial" font-size="23" font-weight="bold" text-anchor="middle" x="750" y="264">UNAUTHORIZED LANDFILL</text><text fill="#18334D" font-family="DejaVu Sans,Arial" font-size="23" font-weight="bold" text-anchor="middle" x="750" y="299">MONITORING PROTOTYPE</text><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="17" font-weight="normal" text-anchor="middle" x="750" y="341">Satellite detection + geospatial matching</text><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="17" font-weight="normal" text-anchor="middle" x="750" y="370">Verification missions + cleanup history</text><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="16" font-weight="normal" text-anchor="middle" x="750" y="399">Controlled model feedback + re-dumping alerts</text><line stroke="#54ac96" stroke-width="1.2" x1="538" x2="962" y1="442" y2="442" /><text fill="#607589" font-family="DejaVu Sans,Arial" font-size="14" font-weight="normal" text-anchor="middle" x="750" y="481">System under development — no government integration</text><rect fill="#eaf3ff" height="96" rx="14" ry="14" stroke="#91b9dc" stroke-width="1.7" width="358" x="56" y="145" /><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="235.0" y="187.6">CITIZEN / VOLUNTEER</text><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="235.0" y="208.6">Photo + location report, status</text><rect fill="#eaf3ff" height="96" rx="14" ry="14" stroke="#91b9dc" stroke-width="1.7" width="358" x="56" y="322" /><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="235.0" y="364.6">AUTHORIZED INSPECTOR</text><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="235.0" y="385.6">Evidence, missions, clearance</text><rect fill="#eaf3ff" height="96" rx="14" ry="14" stroke="#91b9dc" stroke-width="1.7" width="358" x="56" y="499" /><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="235.0" y="541.6">ADMIN / ML OPERATOR</text><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="235.0" y="562.6">Curate datasets, approve models</text><rect fill="#fff4e8" height="96" rx="14" ry="14" stroke="#dda96d" stroke-width="1.7" width="358" x="1086" y="145" /><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="1265.0" y="187.6">LICENSED SATELLITE IMAGERY</text><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="1265.0" y="208.6">GeoTIFF + CRS + acquisition date</text><rect fill="#fff4e8" height="96" rx="14" ry="14" stroke="#dda96d" stroke-width="1.7" width="358" x="1086" y="322" /><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="1265.0" y="364.6">RESEARCH DATASETS</text><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="1265.0" y="385.6">SWAD / compatible annotated images</text><rect fill="#fff4e8" height="96" rx="14" ry="14" stroke="#dda96d" stroke-width="1.7" width="358" x="1086" y="499" /><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="1265.0" y="541.6">BASEMAP / TILE PROVIDER</text><text fill="#244057" font-family="DejaVu Sans,Arial" font-size="15" font-weight="normal" text-anchor="middle" x="1265.0" y="562.6">Third-party tiles under license</text><polyline fill="none" marker-end="url(#arrow)" points="414,193 449,193 449,290 488,290" stroke="#708DA1" stroke-linejoin="round" stroke-width="1.7" /><polyline fill="none" marker-end="url(#arrow)" points="414,370 488,370" stroke="#708DA1" stroke-linejoin="round" stroke-width="1.7" /><polyline fill="none" marker-end="url(#arrow)" points="414,547 449,547 449,504 488,504" stroke="#708DA1" stroke-linejoin="round" stroke-width="1.7" /><polyline fill="none" marker-end="url(#arrow)" points="1086,193 1051,193 1051,290 1012,290" stroke="#708DA1" stroke-linejoin="round" stroke-width="1.7" /><polyline fill="none" marker-end="url(#arrow)" points="1086,370 1012,370" stroke="#708DA1" stroke-linejoin="round" stroke-width="1.7" /><polyline fill="none" marker-end="url(#arrow)" points="1086,547 1051,547 1051,504 1012,504" stroke="#708DA1" stroke-linejoin="round" stroke-width="1.7" /><text fill="#18334D" font-family="DejaVu Sans,Arial" font-size="15" font-weight="bold" text-anchor="start" x="54" y="688">Boundary note:</text><text fill="#607589" font-family="DejaVu Sans,Arial" font-size="14" font-weight="normal" text-anchor="start" x="198" y="688">Imagery access and redistribution rights are not yet confirmed. Government agency connections are out of MVP scope.</text><text fill="#18334D" font-family="DejaVu Sans,Arial" font-size="15" font-weight="bold" text-anchor="start" x="54" y="722">Data note:</text><text fill="#607589" font-family="DejaVu Sans,Arial" font-size="14" font-weight="normal" text-anchor="start" x="154" y="722">Training JPEGs may lack georeferencing; map positions require separate trusted geospatial metadata.</text></svg>