<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Landfill Monitor — UX Prototype</title>
<style>
:root{--ink:#14233b;--muted:#64748b;--line:#e0e7ee;--canvas:#f5f7fa;--teal:#127f75;--teal-light:#e6f5f1;--nav:#101d2e;--white:#fff;--orange:#d17d3b;--red:#ce5659;--green:#17856d;--shadow:0 3px 16px rgba(25,46,74,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--teal)}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--nav);color:#dce6f2;flex:none;display:flex;flex-direction:column;padding:26px 16px 20px}.brand{display:flex;align-items:center;gap:12px;font-weight:760;font-size:17px;color:#fff;padding:2px 11px 25px}.brandmark{background:#14a293;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:19px;color:#fff}.group-heading{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#8b9baf;margin:22px 12px 10px;font-weight:750}.nav{border:0;background:transparent;color:#b5c4d5;display:flex;align-items:center;text-align:left;gap:11px;width:100%;padding:12px;border-radius:10px;margin-bottom:5px;font-weight:580}.nav:hover,.nav:focus-visible{background:#24384f;color:#fff;outline:none}.nav.active{background:#1f3c51;color:#e6fff9}.nav.active .n-icon{color:#4cd3bd}.n-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;font-size:16px}.side-foot{margin-top:auto;border-top:1px solid #2d4058;padding:20px 12px 3px;font-size:11px;color:#a5b7c9;line-height:1.65}.small-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#29bca6;margin-right:6px}
.main{flex:1;min-width:0}.topbar{height:80px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 35px;gap:15px}.breadcrumbs{font-weight:700;font-size:17px;letter-spacing:-.02em}.top-right{display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e6f5f1;color:var(--teal);display:grid;place-items:center;font-weight:800}.content{padding:32px 35px 56px;max-width:1460px;margin:auto}
.headline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px;flex-wrap:wrap}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--teal);margin-bottom:7px}.headline h1{margin:0;font-size:28px;letter-spacing:-.045em;line-height:1.22}.sub{margin:9px 0 0;color:var(--muted);line-height:1.65;max-width:840px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px;font-size:12px;font-weight:730;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}.btn:hover{border-color:var(--teal);color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:#076c64}.btn:disabled{opacity:.46;cursor:not-allowed}.widebtn{width:100%}
.grid{display:grid;gap:17px}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols2{grid-template-columns:1.45fr 1fr}.cols2balanced{grid-template-columns:1fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}.card.pad{padding:22px}.metric-label{font-size:12px;color:var(--muted);font-weight:570;margin-bottom:10px}.metric-val{font-size:31px;line-height:1.15;font-weight:780;letter-spacing:-.05em}.metric-foot{font-size:11px;margin-top:8px;color:var(--muted)}.section-title{font-size:15px;font-weight:760;margin:0 0 17px;letter-spacing:-.015em}.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:10px}.section-header .section-title{margin:0}.badge{font-weight:750;border-radius:50px;padding:6px 9px;font-size:10px;letter-spacing:.01em;display:inline-block;white-space:nowrap;background:#f0f3f8;color:#4c6278}.badge.warn{background:#fff1df;color:#96550c}.badge.good{background:#e5f6ee;color:#13714c}.badge.blue{background:#e7f0ff;color:#365da1}.list{margin:0;padding:0;list-style:none}.list li{padding:14px 0;border-bottom:1px solid #e9eef3}.list li:last-child{border-bottom:0}.list-title{font-weight:730;font-size:13px}.caption{font-size:11px;color:var(--muted);line-height:1.5}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.divider{height:1px;background:var(--line);margin:19px 0}.two-actions{display:flex;gap:9px;flex-wrap:wrap}
.map{position:relative;overflow:hidden;background:#d8e5de;border-radius:11px;border:1px solid #d6e1de;min-height:344px}.map.small{min-height:220px;cursor:crosshair}.map svg{position:absolute;inset:0;width:100%;height:100%}.map-label{position:absolute;font-size:10px;color:#6b7e75;font-weight:720;letter-spacing:.02em}.pin{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:50%;border:3px solid #fff;color:#fff;background:var(--orange);box-shadow:0 3px 12px #37454d60;font-size:10px;font-weight:800;z-index:2}.pin.red{background:var(--red)}.pin.good{background:var(--green)}.pin.selected{outline:3px solid #254f5f88;outline-offset:3px}.map-key{position:absolute;bottom:14px;left:14px;border-radius:8px;padding:8px 10px;font-size:10px;background:#fffef3e8;color:#4e5b58;display:flex;gap:14px;z-index:2}.key-circle{width:8px;height:8px;border-radius:50%;background:var(--orange);display:inline-block;margin-right:4px}.key-circle.red{background:var(--red)}.key-circle.good{background:var(--green)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:17px}.field label{font-size:12px;font-weight:735}.field input,.field select,.field textarea{background:#fff;border:1px solid #cfd9e3;border-radius:9px;padding:11px 12px;width:100%;color:var(--ink);outline-color:#0d9488}.field textarea{min-height:100px;resize:vertical}.help,.privacy{font-size:11px;line-height:1.5;color:var(--muted)}
.phone-outer{max-width:400px;margin:0 auto;background:#142134;padding:9px;border-radius:31px;box-shadow:0 13px 36px #142c4d20}.phone-screen{background:#fff;min-height:590px;border-radius:24px;padding:24px 21px 22px}.phone-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;color:var(--teal);font-size:12px;font-weight:800}.phone-screen h2{font-size:24px;margin:0 0 6px;letter-spacing:-.04em}.phone-screen .sub{font-size:12px;margin-bottom:25px}.photo-box{border:1.5px dashed #a8bec3;background:#f7fafb;padding:12px;border-radius:9px;text-align:center;min-height:75px}.photo-box input{border:0;padding:0;font-size:11px;background:transparent}.photo-box span{font-size:11px;color:#677c8c}
.note{background:#eef6f7;border:1px solid #d4e8e9;color:#45636d;border-radius:10px;padding:12px 14px;font-size:11px;line-height:1.6}.tab{padding:8px 11px;border-radius:7px;font-size:11px;font-weight:740;background:#eef1f5;color:#587084;border:0}.tab.active{background:var(--teal-light);color:#0e7266}.pill-row{display:flex;gap:7px;flex-wrap:wrap}.location-row{width:100%;background:#fff;border:1px solid var(--line);text-align:left;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.location-row:hover,.location-row:focus-visible{border-color:#14a293;outline:0}
.timeline{border-left:2px solid #dce7e8;margin-left:8px;padding-left:21px}.event{position:relative;padding:0 0 22px}.event:before{content:'';position:absolute;left:-28px;top:2px;width:12px;height:12px;background:#12a194;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #b5d5d4}.event:last-child{padding-bottom:0}.event .date{font-size:11px;color:#708295;margin-bottom:6px}.event h4{margin:0 0 5px;font-size:13px}.mini-stat{border:1px solid var(--line);border-radius:10px;padding:13px}.mini-stat strong{display:block;font-size:20px;margin:6px 0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-size:10px;letter-spacing:.04em;color:#637487;text-transform:uppercase;background:#f7f9fb}th,td{padding:13px 10px;border-bottom:1px solid #e9edf2;vertical-align:middle}tr:last-child td{border:0}.faux-image{height:115px;border-radius:9px;background:linear-gradient(32deg,#b9c1ae 10%,#bfbfa7 10% 22%,#8a9e86 23% 42%,#c6baa4 43% 52%,#718e78 53% 63%,#d0c0a3 64%);display:flex;justify-content:end;align-items:start;padding:9px}.faux-image span{background:#263e43bd;color:white;font-size:9px;border-radius:5px;padding:5px}.muted-panel{background:#f7f9fb;border:1px solid #e4ebf0;border-radius:10px;padding:15px}
.toast{position:fixed;bottom:24px;right:24px;padding:15px 18px;border-radius:10px;background:#183c47;color:white;box-shadow:0 8px 30px #001c2b30;z-index:30;font-size:12px;max-width:390px;display:none}.toast.show{display:block}
@media(max-width:1100px){.cols4{grid-template-columns:repeat(2,1fr)}.cols2,.cols2balanced{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{width:63px;padding:18px 7px}.brand{padding:0 7px 28px;font-size:0}.brandmark{font-size:18px}.group-heading,.nav span:not(.n-icon),.side-foot{display:none}.nav{justify-content:center;padding:13px 3px}.nav .n-icon{font-size:20px}.topbar{padding:0 16px;height:70px}.content{padding:22px 16px}.breadcrumbs{font-size:14px}.headline h1{font-size:23px}.phone-outer{max-width:365px}}
@media(max-width:430px){.sidebar{width:52px}.brand{padding:0 4px 20px}.brandmark{width:28px;height:28px}.content{padding:17px 12px}.topbar{padding:0 10px}.avatar{display:none}.cols4{grid-template-columns:1fr 1fr;gap:9px}.metric-val{font-size:24px}.card.pad{padding:15px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">✥</div><div>Landfill Monitor</div></div>
  <div class="group-heading">Monitoring prototype</div>
  <button class="nav active" data-view="overview"><span class="n-icon">▦</span><span>Overview & map</span></button>
  <button class="nav" data-view="citizen"><span class="n-icon">◫</span><span>Citizen report</span></button>
  <div class="group-heading">Inspector workspace</div>
  <button class="nav" data-view="missions"><span class="n-icon">☷</span><span>Verification missions</span></button>
  <button class="nav" data-view="alerts"><span class="n-icon">↻</span><span>Re-dumping alerts</span></button>
  <button class="nav" data-view="history"><span class="n-icon">◔</span><span>Site history</span></button>
  <div class="group-heading">ML operator</div>
  <button class="nav" data-view="models"><span class="n-icon">◈</span><span>Model improvement</span></button>
  <div class="side-foot"><div><span class="small-dot"></span>UX prototype</div>Draft 1.1 · Review Session 8</div>
</aside>
<main class="main">
  <header class="topbar"><span class="breadcrumbs" id="breadcrumb">Monitoring overview</span><div class="top-right"><span class="avatar">D</span></div></header>
  <div class="content" id="app-content"></div>
</main>
</div>
<div id="toast" class="toast"></div>
<script>
(()=>{
const state={view:'overview',selectedSite:'LM-042',chosenLocation:false,markerX:52,markerY:55,citizenReference:'',missionFilter:'all',alertsResolved:false,missionStatus:'Open',missionOutcome:'Not verified',candidateApproved:false,modelActivated:false};
const sites=[
{id:'LM-042',name:'Sector B — Eastern boundary',x:66,y:39,flag:'alert',source:'Satellite + citizen',confidence:'0.86',status:'Recheck required'},
{id:'LM-018',name:'Sector A — Open ground',x:31,y:36,flag:'pending',source:'Satellite only',confidence:'0.54',status:'Needs verification'},
{id:'LM-107',name:'Sector C — Roadside',x:46,y:71,flag:'good',source:'Verified report',confidence:'0.91',status:'Confirmed'},
{id:'LM-065',name:'Sector D — Sparse vegetation',x:80,y:73,flag:'pending',source:'Satellite only',confidence:'0.67',status:'Needs verification'}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;
const btn=(text,action,cl='')=>`<button type="button" class="btn ${cl}" data-action="${esc(action)}">${esc(text)}</button>`;
function notify(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(notify.id);notify.id=setTimeout(()=>t.classList.remove('show'),3500)}
const heading=(eyebrow,title,sub,action='')=>`<div class="headline"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`;
function mainMap(){return `<div class="map" id="map-area" role="img" aria-label="Monitoring map"><svg viewBox="0 0 700 370" preserveAspectRatio="xMidYMid slice"><rect width="700" height="370" fill="#d7e2d9"/><path d="M0 25Q120 90 200 40T420 15T700 70L700 0L0 0Z" fill="#ced9c8"/><path d="M0 280Q110 220 240 293T520 305T700 235V370H0Z" fill="#c8d7c6"/><path d="M-30 155Q130 116 250 196T730 161" stroke="#b4beb0" stroke-width="23" fill="none"/><path d="M-30 155Q130 116 250 196T730 161" stroke="#fffdf4" stroke-width="18" fill="none"/><path d="M180 -20Q235 120 360 185T540 390" stroke="#b4beb0" stroke-width="17" fill="none"/><path d="M180 -20Q235 120 360 185T540 390" stroke="#fffdf4" stroke-width="13" fill="none"/><path d="M65 0Q82 115 45 220T95 390" stroke="#f7f6ed" stroke-width="7" fill="none"/><path d="M675 0Q580 140 630 250T700 360" stroke="#f7f6ed" stroke-width="7" fill="none"/><path d="M550 -10Q535 40 571 86T695 103V-10Z" fill="#c3dde5"/><g fill="#a7baa1" opacity=".8"><rect x="76" y="48" width="66" height="24" rx="2" transform="rotate(-10 76 48)"/><rect x="289" y="27" width="75" height="33" rx="2" transform="rotate(5 289 27)"/><rect x="433" y="255" width="75" height="44" rx="3"/><rect x="115" y="270" width="58" height="34" rx="2"/><rect x="541" y="276" width="46" height="28" rx="2"/></g><g fill="#94a38e" opacity=".45"><circle cx="260" cy="320" r="44"/><circle cx="570" cy="36" r="26"/><circle cx="12" cy="260" r="32"/></g></svg>${sites.map(s=>`<button type="button" class="pin ${s.flag==='alert'?'red':s.flag==='good'?'good':''} ${state.selectedSite===s.id?'selected':''}" style="left:${s.x}%;top:${s.y}%" data-site="${s.id}" title="${esc(s.id+' — '+s.status)}">${s.id.split('-')[1]}</button>`).join('')}<div class="map-label" style="left:13%;top:12%">SECTOR A</div><div class="map-label" style="left:60%;top:11%">SECTOR B</div><div class="map-label" style="left:26%;top:81%">SECTOR C</div><div class="map-label" style="left:75%;top:84%">SECTOR D</div><div class="map-key"><span><i class="key-circle"></i>To review</span><span><i class="key-circle red"></i>Alert</span><span><i class="key-circle good"></i>Confirmed</span></div></div>`}
function pickMap(){return `<div class="map small" id="location-picker"><svg viewBox="0 0 700 350" preserveAspectRatio="xMidYMid slice"><rect width="700" height="350" fill="#d7e2d9"/><path d="M-20 100Q280 185 720 62" stroke="#fdf8ec" stroke-width="24" fill="none"/><path d="M170 -20L520 380" stroke="#fdf8ec" stroke-width="15"/><path d="M0 315Q170 220 320 310T700 264" fill="none" stroke="#acc0b1" stroke-width="55"/><g fill="#acc2b2"><rect x="75" y="40" width="80" height="40" rx="3"/><rect x="515" y="145" width="120" height="45" rx="4"/></g></svg>${state.chosenLocation?`<div class="pin selected good" style="left:${state.markerX}%;top:${state.markerY}%">✓</div>`:''}</div>`}
function overview(){const s=sites.find(x=>x.id===state.selectedSite);return `${heading('Inspector workspace','Monitoring overview','Summary of monitored locations, open verification tasks, and recent alerts.',btn('Create verification mission','createMission','primary'))}<div class="grid cols4" style="margin-bottom:18px"><div class="card pad"><div class="metric-label">Monitored locations</div><div class="metric-val">12</div><div class="metric-foot">Current total</div></div><div class="card pad"><div class="metric-label">Pending verification</div><div class="metric-val">4</div><div class="metric-foot">Open tasks</div></div><div class="card pad"><div class="metric-label">Re-dumping alerts</div><div class="metric-val">${state.alertsResolved?'0':'1'}</div><div class="metric-foot">Needs review</div></div><div class="card pad"><div class="metric-label">Verified observations</div><div class="metric-val">7</div><div class="metric-foot">Confirmed</div></div></div><div class="grid cols2"><div class="card pad"><div class="section-header"><h3 class="section-title">Monitoring map</h3></div>${mainMap()}<div class="divider"></div><div class="row between"><div><div class="list-title">${esc(s.id)} · ${esc(s.name)}</div><div class="caption" style="margin-top:5px">${esc(s.source)} · Confidence ${esc(s.confidence)}</div></div>${badge(s.status,s.flag==='alert'?'warn':s.flag==='good'?'good':'blue')}</div><div class="two-actions" style="margin-top:14px">${btn('View site history','history')}${btn('Open verification','missions','primary')}</div></div><div class="card pad"><div class="section-header"><h3 class="section-title">Attention queue</h3><button class="small-action" data-action="missions">Open all missions →</button></div><ul class="list"><li><div class="row between"><span class="list-title">LM-042 · New evidence after cleanup</span>${badge(state.alertsResolved?'Resolved':'Alert',state.alertsResolved?'good':'warn')}</div><div class="caption" style="margin-top:7px">Satellite observation · Oct 05</div></li><li><div class="row between"><span class="list-title">LM-018 · Satellite-only candidate</span>${badge('Unverified','blue')}</div><div class="caption" style="margin-top:7px">No ground evidence yet</div></li><li><div class="row between"><span class="list-title">LM-065 · Requires inspection</span>${badge('Pending','blue')}</div><div class="caption" style="margin-top:7px">Candidate match · Awaiting review</div></li></ul><div class="divider"></div><h3 class="section-title">Recent activity</h3><ul class="list"><li><div class="row between"><span class="list-title">LM-017 verified</span><span class="caption">2h ago</span></div></li><li><div class="row between"><span class="list-title">New evidence detected · LM-042</span><span class="caption">5h ago</span></div></li><li><div class="row between"><span class="list-title">Mission assigned · LM-065</span><span class="caption">1d ago</span></div></li></ul></div></div>`}
function citizen(){return `${heading('Citizen interface','Report an environmental issue','Submit a photo, select a location, and send a report for review.',btn('See status','status'))}<div class="grid cols2balanced"><div class="card pad" style="background:#f0f4f7"><div class="phone-outer"><div class="phone-screen"><div class="phone-head"><span>LANDFILL MONITOR</span><span>PUBLIC REPORT</span></div><h2>Report a suspected dumping site</h2><p class="sub">Add a photo, the observation date, and the location.</p><form id="citizen-form"><div class="field"><label for="photo">Photo of the location *</label><div class="photo-box"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required/><div style="margin-top:7px"><span>JPG, PNG or WEBP</span></div></div></div><div class="field"><label for="observed-date">Date observed *</label><input id="observed-date" type="date" value="2026-10-18" required/><div class="help">Use the date when the issue was observed.</div></div><div class="field"><label for="coordinates">Location *</label><input id="coordinates" placeholder="Tap Select location below" readonly value="${state.chosenLocation?'Point selected':'Not selected'}" required/><button class="btn" data-action="chooseLocation" style="margin-top:5px" type="button">Select location</button></div><div class="field"><label for="details">Description (optional)</label><textarea id="details" placeholder="Short note"></textarea></div><button type="submit" class="btn primary widebtn">Submit report</button></form>${state.citizenReference?`<div class="note" style="margin-top:12px">Reference <strong>${esc(state.citizenReference)}</strong> created. ${btn('View status','status')}</div>`:''}</div></div></div><div class="grid" style="grid-template-rows:auto 1fr"><div class="card pad"><h3 class="section-title">Citizen journey</h3><ol style="padding-left:20px;line-height:2;color:#4c6174"><li>Add a relevant photo</li><li>Select the observation date</li><li>Choose a location on the map</li><li>Submit the report</li><li>Track the status by reference</li></ol></div><div class="card pad"><div class="section-header"><h3 class="section-title">Location selection</h3>${badge(state.chosenLocation?'Selected':'Select location',state.chosenLocation?'good':'')}</div>${pickMap()}<div class="caption" style="margin-top:11px">Click on the map to place the point.</div></div></div></div>`}
function status(){return `${heading('Citizen interface','Track a submitted report','Check the current status using the report reference.',btn('Back to report','citizen'))}<div class="grid cols2balanced"><div class="card pad"><div class="field"><label for="ref">Reference</label><input id="ref" value="${esc(state.citizenReference||'RP-001')}"/></div>${btn('Check status','lookup','primary')}<div class="divider"></div><h3 class="section-title">RP-001 · Public status</h3>${badge('Under review','blue')}<p class="sub">Your report has been received and is currently under review.</p></div><div class="card pad"><h3 class="section-title">Available information</h3><div class="note">Reference number, current status, and update timeline.</div></div></div>`}
function missions(){const done=state.missionStatus==='Completed';return `${heading('Inspector workspace','Verification missions','Review pending cases, record outcomes, and keep each mission up to date.',btn('View map','overview'))}<div class="grid cols2"><div class="card pad"><div class="section-header"><h3 class="section-title">Mission queue</h3><div class="pill-row"><button class="tab ${state.missionFilter==='all'?'active':''}" data-filter="all">All</button><button class="tab ${state.missionFilter==='open'?'active':''}" data-filter="open">Open</button></div></div>${state.missionFilter==='all'||!done?`<button class="location-row" data-action="missionDetail"><div><div class="list-title">VM-021 · Inspect LM-018</div><div class="caption" style="margin-top:5px">No ground evidence · Source: satellite detection</div></div>${badge(state.missionStatus,done?'good':'blue')}</button>`:''}<button class="location-row" data-action="missionDetail"><div><div class="list-title">VM-022 · Recheck LM-042</div><div class="caption" style="margin-top:5px">New evidence after cleanup</div></div>${badge('Open','warn')}</button><button class="location-row" data-action="missionDetail"><div><div class="list-title">VM-019 · Validate evidence match</div><div class="caption" style="margin-top:5px">Two observations near the same site</div></div>${badge('In progress','blue')}</button></div><div class="card pad"><div class="section-header"><h3 class="section-title">Selected mission: VM-021</h3>${badge(state.missionStatus,done?'good':'blue')}</div><p class="caption">Linked location: LM-018 · Satellite detection dated 09 Oct 2026</p><div class="faux-image"><span>Satellite preview</span></div><div class="divider"></div><div class="field"><label for="mission-outcome">Verification outcome</label><select id="mission-outcome"><option value="Not verified" ${state.missionOutcome==='Not verified'?'selected':''}>Not verified</option><option value="Waste present" ${state.missionOutcome==='Waste present'?'selected':''}>Waste present</option><option value="False positive" ${state.missionOutcome==='False positive'?'selected':''}>False positive / no waste found</option><option value="Inconclusive" ${state.missionOutcome==='Inconclusive'?'selected':''}>Inconclusive</option></select></div><div class="field"><label for="mission-notes">Notes</label><textarea id="mission-notes" placeholder="Add notes"></textarea></div><div class="two-actions">${btn('Start mission','startMission')}${btn('Save result','completeMission','primary')}</div></div></div>`}
function alerts(){return `${heading('Inspector workspace','Re-dumping alerts','Review new observations linked to previously cleared locations.',btn('Open site history','history'))}<div class="grid cols2"><div class="card pad"><div class="section-header"><h3 class="section-title">Alert RD-0042</h3>${badge(state.alertsResolved?'Resolved':'Recheck required',state.alertsResolved?'good':'warn')}</div><p class="caption">Monitored location LM-042 · Sector B — Eastern boundary</p><div class="timeline" style="margin-top:22px"><div class="event"><div class="date">14 Sep 2026</div><h4>Cleanup confirmed</h4><div class="caption">Status changed to Cleared.</div></div><div class="event"><div class="date">05 Oct 2026</div><h4>New satellite observation</h4><div class="caption">Observation OBS-229 linked to LM-042.</div></div><div class="event"><div class="date">12 Oct 2026</div><h4>Alert created</h4><div class="caption">Reinspection required.</div></div></div></div><div class="card pad"><h3 class="section-title">Review rule</h3><div class="grid cols2balanced"><div class="mini-stat"><div class="caption">Cleanup date</div><strong>Sep 14</strong><div class="caption">2026</div></div><div class="mini-stat"><div class="caption">New observation date</div><strong>Oct 05</strong><div class="caption">2026</div></div></div><div class="divider"></div><div class="field"><label for="alert-decision">Review outcome</label><select id="alert-decision"><option value="Reinspection requested">Reinspection requested</option><option value="False alarm">Not a recurrence / false alarm</option><option value="Requires additional evidence">Requires additional evidence</option></select></div><div class="two-actions">${btn(state.alertsResolved?'Already resolved':'Resolve alert','resolveAlert','primary')}${btn('Create verification mission','createMission')}</div><div class="divider"></div><div class="muted-panel"><div class="list-title">Rule check</div><p class="caption">An observation dated before cleanup should not trigger an alert.</p>${btn('Test old-image rule','testOld')}</div></div></div>`}
function history(){return `${heading('Inspector workspace','Site monitoring history','View all observations, status changes, and related review events for one location.',btn('Back to map','overview'))}<div class="grid cols2"><div class="card pad"><div class="section-header"><h3 class="section-title">LM-042 · Sector B — Eastern boundary</h3>${badge(state.alertsResolved?'Review closed':'Recheck required',state.alertsResolved?'good':'warn')}</div><div class="faux-image"><span>Site preview</span></div><div class="divider"></div><div class="grid cols2balanced"><div class="mini-stat"><div class="caption">Location</div><strong style="font-size:15px">LM-042</strong><div class="caption">Sector B</div></div><div class="mini-stat"><div class="caption">Source records</div><strong>3</strong><div class="caption">Linked records</div></div></div></div><div class="card pad"><h3 class="section-title">Evidence & status timeline</h3><div class="timeline"><div class="event"><div class="date">07 Sep 2026 · Satellite observation</div><h4>Potential dumping identified</h4><div class="caption">OBS-121 · model version v0.1</div></div><div class="event"><div class="date">14 Sep 2026 · Cleanup review</div><h4>Cleared status recorded</h4><div class="caption">CE-014 · inspector decision</div></div><div class="event"><div class="date">05 Oct 2026 · Satellite observation</div><h4>New evidence near cleared site</h4><div class="caption">OBS-229</div></div><div class="event"><div class="date">12 Oct 2026 · Rule evaluation</div><h4>Potential re-dumping flagged</h4><div class="caption">RD-0042 · pending inspection</div></div></div></div></div>`}
function models(){return `${heading('ML operator workspace','Continuous model improvement','Review approved samples, export a dataset version, and compare model releases.',btn('Review satellite candidate','reviewCandidate'))}<div class="grid cols4" style="margin-bottom:17px"><div class="card pad"><div class="metric-label">Satellite candidates</div><div class="metric-val">3</div><div class="metric-foot">Queue</div></div><div class="card pad"><div class="metric-label">Approved examples</div><div class="metric-val">${state.candidateApproved?'1':'0'}</div><div class="metric-foot">Ready for export</div></div><div class="card pad"><div class="metric-label">Baseline mAP</div><div class="metric-val" style="font-size:24px">N/A</div><div class="metric-foot">Pending evaluation</div></div><div class="card pad"><div class="metric-label">Active model</div><div class="metric-val" style="font-size:23px">${state.modelActivated?'v0.2':'v0.1'}</div><div class="metric-foot">Current version</div></div></div><div class="grid cols2"><div class="card pad"><div class="section-header"><h3 class="section-title">Dataset candidate review</h3>${badge('Manual QA','blue')}</div><div class="faux-image"><span>Satellite crop</span></div><div class="divider"></div><div class="row between" style="align-items:flex-start"><div><div class="list-title">Candidate SC-008</div><div class="caption" style="margin-top:5px">Satellite crop · bounding box review</div></div>${badge(state.candidateApproved?'Approved':'Pending review',state.candidateApproved?'good':'blue')}</div><div class="muted-panel" style="margin-top:14px"><div class="caption">Checklist</div><div style="line-height:2;margin-top:8px;font-size:12px">✓ Source recorded<br/>✓ License checked<br/>✓ Annotation reviewed<br/>✓ Split checked</div></div><div class="two-actions" style="margin-top:15px">${btn(state.candidateApproved?'Sample reviewed':'Approve sample','approveCandidate','primary')}${btn('Export manifest','exportManifest')}</div></div><div class="card pad"><h3 class="section-title">Version evaluation</h3><div class="tablewrap"><table><thead><tr><th>Model</th><th>Evaluation</th><th>Status</th></tr></thead><tbody><tr><td>v0.1 baseline</td><td>Not performed</td><td>${badge('Active','blue')}</td></tr><tr><td>v0.2 candidate</td><td>Not performed</td><td>${badge('Pending','warn')}</td></tr></tbody></table></div><div class="divider"></div><h3 class="section-title">Promotion steps</h3><div class="timeline"><div class="event"><div class="date">1 · Dataset preparation</div><h4>Review source and annotation quality</h4><div class="caption">Prepare the next dataset version.</div></div><div class="event"><div class="date">2 · Offline training</div><h4>Train candidate model</h4><div class="caption">Run a versioned experiment.</div></div><div class="event"><div class="date">3 · Baseline comparison</div><h4>Compare evaluation results</h4><div class="caption">Check Precision, Recall, mAP, and latency.</div></div><div class="event"><div class="date">4 · Model release</div><h4>Activate selected version</h4><div class="caption">Promote after review.</div></div></div><button class="btn" disabled title="Requires completed evaluation">Promote model</button></div></div>`}
const screens={overview,citizen,status,missions,alerts,history,models};
const labels={overview:'Monitoring overview',citizen:'Citizen reporting',status:'Public report status',missions:'Verification missions',alerts:'Re-dumping alerts',history:'Site history',models:'Model improvement'};
function render(){document.getElementById('app-content').innerHTML=screens[state.view]();document.getElementById('breadcrumb').textContent=labels[state.view];document.querySelectorAll('.nav').forEach(el=>el.classList.toggle('active',el.dataset.view===state.view));if(state.view==='citizen'){const f=document.getElementById('citizen-form');f.addEventListener('submit',e=>{e.preventDefault();if(!state.chosenLocation){notify('Please select a location before submitting.');return;}const photo=document.getElementById('photo');if(!photo.files?.length){notify('Please choose a photo before submitting.');return;}state.citizenReference='RP-'+String(Math.floor(Math.random()*9000)+1000);notify('Report submitted. Reference generated.');render();});const m=document.getElementById('location-picker');m?.addEventListener('click',e=>{const r=m.getBoundingClientRect();state.markerX=Math.max(8,Math.min(92,Math.round((e.clientX-r.left)/r.width*100)));state.markerY=Math.max(12,Math.min(88,Math.round((e.clientY-r.top)/r.height*100)));state.chosenLocation=true;const coordinateField=document.getElementById('coordinates');if(coordinateField)coordinateField.value='Point selected';m.querySelectorAll('.pin.selected').forEach(x=>x.remove());const pin=document.createElement('div');pin.className='pin selected good';pin.textContent='✓';pin.style.left=state.markerX+'%';pin.style.top=state.markerY+'%';m.appendChild(pin);const badgeEl=m.parentElement.querySelector('.badge');if(badgeEl){badgeEl.textContent='Selected';badgeEl.className='badge good';}notify('Location selected.');});}}
function nav(v){state.view=v;render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){nav(view.dataset.view);return;}const site=e.target.closest('[data-site]');if(site){state.selectedSite=site.dataset.site;render();return;}const filt=e.target.closest('[data-filter]');if(filt){state.missionFilter=filt.dataset.filter;render();return;}const a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case 'createMission':state.missionStatus='Open';nav('missions');notify('Mission created.');break;case 'chooseLocation':document.getElementById('location-picker')?.scrollIntoView({block:'center',behavior:'smooth'});notify('Click on the map to select a location.');break;case 'startMission':state.missionStatus='In Progress';render();notify('Mission set to In Progress.');break;case 'completeMission':{const value=document.getElementById('mission-outcome')?.value||'Not verified';if(value==='Not verified'){notify('Please choose a verification outcome.');return;}state.missionOutcome=value;state.missionStatus='Completed';render();notify('Mission saved: '+value);break;}case 'resolveAlert':if(state.alertsResolved){notify('This alert is already resolved.');return;}state.alertsResolved=true;render();notify('Alert resolved.');break;case 'testOld':notify('Rule check passed: earlier observation does not create an alert.');break;case 'approveCandidate':state.candidateApproved=true;render();notify('Sample approved.');break;case 'exportManifest':{const blob=new Blob([JSON.stringify({version:'dataset-v0.1',samples:state.candidateApproved?['SC-008']:[]},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='dataset_manifest.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Manifest exported.');break;}case 'lookup':notify('Status loaded.');break;case 'missionDetail':notify('Mission details opened.');break;case 'overview':case 'citizen':case 'status':case 'missions':case 'alerts':case 'history':case 'models':nav(a.dataset.action);break;default:break;}});
render();
})();
</script>
</body>
</html>
